name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANLOBEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANLOBEHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANLOBEHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANLOBEHUB_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Fail fast (10s, not 5min). PKCS12 forces keypass == storepass, so a
          # distinct KEY_PASSWORD can only break the build -> reject it here.
          TYPE=$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "Keystore type" | awk '{print $3}')
          echo "Keystore type: $TYPE"
          if [ "$TYPE" = "PKCS12" ] && [ -n "$KEY_PASSWORD" ] && [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::PKCS12 requires key password == store password; delete ANLOBEHUB_KEY_PASSWORD or make them match."
            exit 1
          fi
          if [ "$TYPE" = "JKS" ] || [ "$TYPE" = "JCEKS" ]; then
            EFFECTIVE_KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            keytool -keypasswd -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keypass "$EFFECTIVE_KEY_PASS" -new "$EFFECTIVE_KEY_PASS" > /dev/null
          fi
      - name: Derive version from tag
        id: version
        run: |
          # Tag rule: "<versionName>", e.g. "0.0.6". versionCode is the
          # workflow run number (monotonic, works with shallow clones).
          # Tolerate an optional leading "v" (v0.0.6 and 0.0.6 both work).
          NAME="${GITHUB_REF_NAME#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "file=anlobehub-v${NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          ANLOBEHUB_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANLOBEHUB_KEYSTORE_PASSWORD: ${{ secrets.ANLOBEHUB_KEYSTORE_PASSWORD }}
          ANLOBEHUB_KEY_ALIAS: ${{ secrets.ANLOBEHUB_KEY_ALIAS }}
          ANLOBEHUB_KEY_PASSWORD: ${{ secrets.ANLOBEHUB_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "${{ steps.version.outputs.file }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.file }}
          generate_release_notes: true
